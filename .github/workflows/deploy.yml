name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site and inject asset version
        run: |
          VERSION="${GITHUB_SHA::7}"
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='docs' --exclude='.gitignore' ./ _site/
          find _site -name '*.html' -exec sed -i -E "s/\?v=[^\"']*/?v=${VERSION}/g" {} +
          echo "Asset version: ${VERSION}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
